<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div class="max-w-7xl mx-auto p-6 space-y-8">
    <header>
      <h1 class="text-3xl font-bold">Warehouse Management System</h1>
      <p class="text-slate-600">Управление складом, заказами и подбором</p>
    </header>

    <section class="bg-white rounded-xl shadow p-6 space-y-4">
      <h2 class="text-xl font-semibold">Склад</h2>
      <div class="grid md:grid-cols-3 gap-3">
        <input id="warehouseSearch" class="border rounded px-3 py-2" placeholder="Поиск по id, названию, категории" />
        <button id="searchWarehouseBtn" class="bg-blue-600 text-white rounded px-4 py-2">Поиск</button>
        <button id="refreshWarehouseBtn" class="bg-slate-600 text-white rounded px-4 py-2">Обновить</button>
      </div>

      <form id="warehouseForm" class="grid md:grid-cols-5 gap-3 items-end">
        <input id="warehouseId" class="border rounded px-3 py-2" placeholder="ID" required />
        <input id="warehouseName" class="border rounded px-3 py-2" placeholder="Название" required />
        <input id="warehouseQuantity" type="number" min="0" class="border rounded px-3 py-2" placeholder="Количество" required />
        <input id="warehouseCategory" class="border rounded px-3 py-2" placeholder="Категория" />
        <button class="bg-emerald-600 text-white rounded px-4 py-2">Добавить товар</button>
      </form>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left border-b">
              <th class="py-2">ID</th>
              <th class="py-2">Название</th>
              <th class="py-2">Количество</th>
              <th class="py-2">Категория</th>
              <th class="py-2">Действия</th>
            </tr>
          </thead>
          <tbody id="warehouseTable"></tbody>
        </table>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow p-6 space-y-4">
      <h2 class="text-xl font-semibold">Заказы</h2>
      <form id="orderForm" class="grid md:grid-cols-4 gap-3">
        <input id="orderId" class="border rounded px-3 py-2" placeholder="ID заказа" required />
        <input id="orderCustomer" class="border rounded px-3 py-2" placeholder="Клиент" required />
        <input id="orderDate" type="date" class="border rounded px-3 py-2" required />
        <input id="orderAssemblyLocation" class="border rounded px-3 py-2" placeholder="Место сборки" />
        <select id="orderStatus" class="border rounded px-3 py-2">
          <option>new</option>
          <option>in_progress</option>
          <option>partially_picked</option>
          <option>completed</option>
        </select>
        <input id="orderNote" class="border rounded px-3 py-2" placeholder="Примечание" />
        <label class="flex items-center gap-2 px-2">
          <input id="orderT34Passport" type="checkbox" class="h-4 w-4" />
          <span>T34 Passport</span>
        </label>
        <button class="bg-emerald-600 text-white rounded px-4 py-2">Создать заказ</button>
      </form>

      <div class="border rounded p-3 space-y-2">
        <h3 class="font-medium">Товары заказа</h3>
        <div class="grid md:grid-cols-4 gap-2">
          <input id="orderItemId" class="border rounded px-3 py-2" placeholder="Item ID" />
          <input id="orderRequiredQuantity" type="number" min="0" class="border rounded px-3 py-2" placeholder="Required" />
          <input id="orderPickedQuantity" type="number" min="0" class="border rounded px-3 py-2" placeholder="Picked" value="0" />
          <button id="addOrderItemBtn" type="button" class="bg-blue-600 text-white rounded px-4 py-2">Добавить в список</button>
        </div>
        <ul id="orderItemsDraft" class="list-disc pl-5 text-sm"></ul>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left border-b">
              <th class="py-2">ID</th>
              <th class="py-2">Клиент</th>
              <th class="py-2">Дата</th>
              <th class="py-2">Статус</th>
              <th class="py-2">Items</th>
              <th class="py-2">Действия</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </section>

    <section class="bg-white rounded-xl shadow p-6 space-y-4">
      <h2 class="text-xl font-semibold">Модуль подбора</h2>
      <form id="pickingForm" class="grid md:grid-cols-4 gap-3">
        <input id="pickingOrderId" class="border rounded px-3 py-2" placeholder="Order ID" required />
        <input id="pickingItemId" class="border rounded px-3 py-2" placeholder="Item ID" required />
        <input id="pickingQuantity" type="number" min="0" class="border rounded px-3 py-2" placeholder="Новый pickedQuantity" required />
        <button class="bg-indigo-600 text-white rounded px-4 py-2">Обновить подбор</button>
      </form>
      <pre id="historyViewer" class="bg-slate-900 text-slate-100 p-3 rounded text-xs overflow-auto"></pre>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
